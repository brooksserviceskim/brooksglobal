<title>동인천상회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Gothic+Coding:wght@700&display=swap">

<style>
:root{
  --bg:#F3F1EC;         /* 따뜻한 오프화이트 */
  --bg-2:#E7E3DB;
  --card:#FFFFFF;
  --ink:#171A1F;
  --ink-2:#464B55;
  --ink-3:#7A808B;
  --line:#DAD6CE;
  --green:#1E7B45;      /* 새마을 모자 */
  --red:#D3372B;        /* 작업 조끼 */
  --yellow:#FFC93C;     /* 자수 */
  --teal:#2A8C86;       /* 안경 */
  --kraft:#C99A5B;
  --maxw:1180px;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
  --mono:'Nanum Gothic Coding',monospace;
  --shadow:0 18px 40px -18px rgba(23,26,31,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;
  word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4{margin:0;text-wrap:balance;word-break:keep-all;line-height:1.2}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:8px}

/* ---------- 로더 ---------- */
#loader{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s,visibility .45s}
#loader.done{opacity:0;visibility:hidden}
#loader .lg{font-weight:900;font-size:22px;letter-spacing:-.02em}
#loader .lg img{width:min(360px,64vw);height:auto;display:block}
.bar{width:min(260px,64vw);height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .15s}
#loader .pct{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.12em}

/* ---------- 상단 바 ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:flex-end;gap:16px;
  padding:16px max(22px,calc((100vw - var(--maxw))/2 + 22px));pointer-events:none}
.topbar > *{pointer-events:auto}
.topnav{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:99px;padding:5px}
.topnav button,.topnav a{text-decoration:none;font-size:14px;font-weight:700;color:var(--ink-2);padding:8px 14px;border-radius:99px;transition:background .15s,color .15s}
.topnav button:hover,.topnav a:hover{background:var(--bg-2);color:var(--ink)}
.topnav .cta{background:var(--ink);color:#fff}
.topnav .cta:hover{background:var(--green);color:#fff}
@media(max-width:720px){.topnav button:not(.cta){display:none}}

/* ---------- 히어로 = 화면 전체 ---------- */
.hero{position:fixed;inset:0;overflow:hidden;touch-action:pan-y;user-select:none;
  background:
    radial-gradient(60% 50% at 18% 18%,rgba(42,140,134,.14),transparent 70%),
    radial-gradient(50% 45% at 84% 22%,rgba(255,201,60,.18),transparent 70%),
    radial-gradient(70% 60% at 50% 100%,rgba(30,123,69,.12),transparent 70%),
    linear-gradient(180deg,#F6F4F0,#EFECE6)}
.wordmark{position:absolute;left:50%;top:clamp(78px,11vh,120px);transform:translateX(-50%);z-index:2;text-align:center;pointer-events:none;width:min(92vw,900px)}
.wordmark .en{height:clamp(44px,8.6vw,104px);width:auto;display:block;margin:0 auto;
  filter:drop-shadow(0 14px 22px rgba(23,26,31,.20))}
.wordmark .sub{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:12px;flex-wrap:wrap}
.wordmark .sub b{font-weight:900;font-size:clamp(15px,2.1vw,22px);letter-spacing:-.03em;color:var(--ink)}
.wordmark .sub s{text-decoration:none;width:1px;height:13px;background:var(--line-2,#C9C4BA);display:block;flex:none}
.wordmark em{font-style:normal;font-family:var(--mono);font-size:clamp(9px,1.2vw,11px);letter-spacing:.2em;color:var(--ink-3);white-space:nowrap}
.wordmark i{display:block;margin-top:9px;font-style:normal;font-weight:700;font-size:clamp(14px,1.9vw,19px);color:var(--ink-2)}
@media(max-width:640px){ .wordmark .sub{gap:8px} .wordmark .sub s{display:none} }

#stage{position:absolute;inset:0;z-index:5}


/* ---- 물리 오브젝트 : 글로시 큐브 ---- */
.obj{position:absolute;top:0;left:0;cursor:grab;will-change:transform;touch-action:none}
.obj:active{cursor:grabbing}
.cube{position:absolute;inset:0;transform-style:preserve-3d;animation:spin var(--dur,20s) linear infinite;animation-delay:var(--delay,0s)}
@keyframes spin{from{transform:perspective(680px) rotateX(-16deg) rotateY(0deg)}to{transform:perspective(680px) rotateX(-16deg) rotateY(360deg)}}
.cube.tilt{animation-name:spin2}
@keyframes spin2{from{transform:perspective(680px) rotateX(14deg) rotateZ(8deg) rotateY(360deg)}to{transform:perspective(680px) rotateX(14deg) rotateZ(8deg) rotateY(0deg)}}
.f{position:absolute;inset:0;display:grid;place-items:center;border-radius:14%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 -14px 20px -12px rgba(0,0,0,.35),inset 0 14px 18px -12px rgba(255,255,255,.75)}
.f-fr{transform:translateZ(var(--h))}
.f-bk{transform:rotateY(180deg) translateZ(var(--h))}
.f-rt{transform:rotateY(90deg) translateZ(var(--h))}
.f-lf{transform:rotateY(-90deg) translateZ(var(--h))}
.f-tp{transform:rotateX(90deg) translateZ(var(--h))}
.f-bm{transform:rotateX(-90deg) translateZ(var(--h))}
.f b{font-weight:900;font-size:var(--fs,15px);line-height:1.15;color:#fff;text-align:center;letter-spacing:-.02em;white-space:nowrap;
  text-shadow:0 1px 0 rgba(0,0,0,.18)}
.f small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:rgba(255,255,255,.8);margin-top:4px;font-weight:700}
.f.deco b{font-size:calc(var(--fs,15px)*1.3)}
.obj.pop{filter:brightness(1.2)}
/* ---- 오브제 3D(GLB) 층. GLB 가 없으면 이 캔버스는 아예 만들어지지 않습니다 ---- */
#objgl{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.obj.is3d .cube{visibility:hidden}
.objlabel{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;text-align:center;white-space:nowrap;
  word-break:keep-all;overflow-wrap:break-word;pointer-events:none}
.objlabel b{display:block;font-weight:900;font-size:13px;letter-spacing:-.02em;color:var(--ink)}
.objlabel small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--ink-3);margin-top:2px}
.objlabel.credit{margin-top:8px}
.objlabel.credit small{display:block;font-size:8.5px;letter-spacing:.2em;color:var(--ink-3);margin-top:0}
@media(max-width:640px){.objlabel{white-space:normal;width:96px;margin-top:4px;line-height:1.25}.objlabel b{font-size:10.5px;letter-spacing:-.03em}.objlabel small{display:none}
  .objlabel.credit{width:auto;margin-top:5px}.objlabel.credit small{display:block;font-size:7.5px;letter-spacing:.14em}}

/* ---- 아바타 ---- */
.avatar{position:absolute;left:50%;top:56%;z-index:3;height:clamp(240px,53vh,490px);cursor:pointer;transform:translate(-50%,-50%)}
.avatar video{position:fixed;left:-4000px;top:0;width:333px;height:880px;pointer-events:none}
.avatar canvas,.avatar .exp{height:100%;width:auto;aspect-ratio:666/880;display:block;filter:drop-shadow(0 20px 26px rgba(23,26,31,.22))}
.avatar .exp{position:absolute;inset:0;object-fit:contain}
.bubble{position:absolute;z-index:6;left:calc(50% + min(125px,24vw));top:calc(50% - min(155px,26vw));
  background:#fff;color:var(--ink);border-radius:18px;padding:11px 16px;font-weight:900;font-size:16px;line-height:1;white-space:nowrap;
  box-shadow:var(--shadow);animation:wob 2.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-9px;width:16px;height:16px;background:#fff;border-radius:3px;transform:rotate(45deg)}
@keyframes wob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* HUD */
.hud{position:absolute;left:0;right:0;bottom:58px;z-index:7;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:0 max(18px,calc((100vw - var(--maxw))/2 + 18px))}
.gswitch{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:99px;padding:8px 10px 8px 16px;box-shadow:var(--shadow);font-weight:700;font-size:13px}
.knob{width:44px;height:24px;border-radius:99px;background:var(--bg-2);position:relative;transition:background .2s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.gswitch[aria-pressed="true"] .knob{background:var(--green)}
.gswitch[aria-pressed="true"] .knob::after{transform:translateX(20px);background:#fff}
.hint{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-3)}
.foot{position:absolute;left:0;right:0;bottom:16px;z-index:7;text-align:center;pointer-events:none;
  font-family:var(--mono);font-size:10.5px;line-height:1.75;letter-spacing:.08em;color:var(--ink-3);
  padding:0 20px;word-break:keep-all;overflow-wrap:break-word}
.foot b{font-weight:700;color:var(--ink-2);letter-spacing:.11em}
.foot i{font-style:normal}
.foot .mbr{display:none}
@media(max-width:640px){.hint{display:none}
  .foot{font-size:9px;letter-spacing:.04em;bottom:10px;padding:0 12px}
  .foot .sep{display:none}
  .foot .mbr{display:inline}
  .hud{bottom:74px}
  .avatar{height:auto;width:min(56vw,270px);top:57%}
  .avatar canvas,.avatar .exp{width:100%;height:auto}}

/* ---------- 패널 (모든 내용은 여기서) ---------- */
#scrim{position:fixed;inset:0;z-index:100;background:rgba(23,26,31,.35);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#scrim.open{opacity:1;visibility:visible}
#panel{position:fixed;z-index:101;right:16px;top:16px;bottom:16px;width:min(520px,calc(100% - 32px));background:var(--card);border-radius:24px;
  box-shadow:0 40px 80px -30px rgba(23,26,31,.5);transform:translateX(calc(100% + 32px));transition:transform .38s cubic-bezier(.22,.9,.28,1);display:flex;flex-direction:column;overflow:hidden}
#panel.open{transform:none}
@media(max-width:600px){#panel{right:0;left:0;top:auto;bottom:0;width:100%;height:88svh;border-radius:24px 24px 0 0;transform:translateY(102%)}}
.phead{position:relative;padding:26px 28px 18px;border-bottom:1px solid var(--line)}
.phead .chip{display:none}
.phead span{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-3);display:block}
.phead h3{font-size:24px;font-weight:900;letter-spacing:-.02em;margin-top:6px}
.pclose{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;font-size:18px;line-height:1}
.pbody{padding:22px 28px 30px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.pbody > p{font-size:15px;color:var(--ink-2);font-weight:500}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plist li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:14px;color:var(--ink)}
.plist li::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--dot,var(--green));margin-top:7px}
.pmeta{border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--ink-3)}
.pcred{border-left:3px solid var(--dot,var(--green));background:var(--bg);border-radius:0 12px 12px 0;
  padding:13px 16px;font-size:13.5px;font-weight:500;color:var(--ink-2);line-height:1.7;
  word-break:keep-all;overflow-wrap:break-word}
.pcta{margin-top:auto;padding:16px 28px 22px;border-top:1px solid var(--line);background:var(--bg)}
.pcta a{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;background:var(--ink);color:#fff;padding:14px;border-radius:14px;font-weight:700;font-size:15px}
.pcta a:hover{background:var(--green)}
/* 연락처 */
#cform{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.fld label em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--green);
  border:1px solid var(--line);border-radius:99px;padding:2px 7px}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;
  word-break:keep-all;overflow-wrap:break-word;-webkit-appearance:none;appearance:none}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:40px}
.fld textarea{resize:vertical;min-height:118px;line-height:1.65}
.fld input::placeholder,.fld textarea::placeholder{color:var(--ink-3);opacity:.8}
.fld input:focus,.fld select:focus,.fld textarea:focus{background:var(--card);border-color:var(--green);outline:none}
.fld.bad input,.fld.bad textarea{border-color:var(--red);background:#FDF3F2}
.botcheck{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.cerr{font-size:13px;font-weight:700;color:var(--red);display:none}
.cerr.on{display:block}
.csend{background:var(--ink);color:#fff;padding:15px;border-radius:14px;font-weight:700;font-size:15px;text-align:center}
.csend:hover{background:var(--green)}
.csend[disabled]{opacity:.55;cursor:default}
.cnote{font-size:12.5px;color:var(--ink-3);line-height:1.7}
.lnk{font-size:12.5px;font-weight:700;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:0}
.lnk:hover{color:var(--green)}
.cdone{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px}
.cdone h4{font-size:17px;font-weight:900;letter-spacing:-.02em}
.cdone p{margin-top:9px;font-size:14px;color:var(--ink-2)}
.cdone pre{margin:14px 0 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;
  font-family:var(--mono);font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-word;max-height:210px;overflow:auto;
  user-select:all;-webkit-user-select:all}
.cdone .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cdone .row button,.cdone .row a{flex:1 1 150px;text-align:center;text-decoration:none;padding:11px 12px;border-radius:12px;
  font-weight:700;font-size:14px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.cdone .row button:hover,.cdone .row a:hover{background:var(--bg-2)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);z-index:300;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transition:opacity .22s,transform .22s,visibility .22s;max-width:calc(100vw - 32px);
  word-break:keep-all;overflow-wrap:break-word;text-align:center}
#toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
/* 패널 안 목록형 콘텐츠 */
.plinks{display:flex;flex-direction:column;gap:8px}
.plinks button{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--bg);font-weight:700;font-size:15px}
.plinks button:hover{background:var(--bg-2)}
.plinks button i{width:12px;height:12px;border-radius:4px;background:var(--dot);flex:none;margin-right:10px}
.plinks button em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.12em}
.facts{margin:0;border-top:1px solid var(--line)}
.fact{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.fact dt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);padding-top:4px}
.fact dd{margin:0;font-weight:500}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px}
.step b{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
.step h4{font-size:15px;font-weight:900}
.step p{font-size:13.5px;color:var(--ink-2)}
.portrait{border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--bg-2)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>

</head>
<body>
<div id="loader">
  <div class="lg" id="loaderLogo">동인천상회</div>
  <div class="bar"><i id="lbar"></i></div>
  <div class="pct" id="lpct">0%</div>
</div>

<header class="topbar">
  <nav class="topnav">
    <button data-open="services">하는 일</button>
    <button data-open="about">소개</button>
    <button data-open="process">진행 순서</button>
    <button class="cta" data-open="contact">문의하기</button>
  </nav>
</header>

<div class="hero" id="top">
  <div class="wordmark" id="wordmark">
    <img class="en" src="media/wordmark.webp" alt="dongincheon">
    <span class="sub"><b>동인천상회</b><s></s><em>DONGINCHEON TRADING CO.</em></span>
    <i>브랜드의 겉면을 만듭니다</i>
  </div>

var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var stage=document.getElementById('stage'), hero=document.querySelector('.hero');
var Engine=Matter.Engine,World=Matter.World,Bodies=Matter.Bodies,Body=Matter.Body,
    Composite=Matter.Composite,Mouse=Matter.Mouse,MouseConstraint=Matter.MouseConstraint,Events=Matter.Events;

var engine=Engine.create(); engine.gravity.x=0; engine.gravity.y=0;
var world=engine.world, W=hero.clientWidth, H=hero.clientHeight;
var items=[], mc=null, mouse=null, avBody=null;
function speedOf(b){ var vx=b.position.x-b.positionPrev.x, vy=b.position.y-b.positionPrev.y; return Math.max(Math.hypot(vx,vy), Math.hypot(b.velocity.x,b.velocity.y)); }

function hexToRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function toHex(c){return '#'+c.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return ('0'+v.toString(16)).slice(-2);}).join('');}
function lighten(h,a){return toHex(hexToRgb(h).map(function(v){return v+(255-v)*a;}));}
function darken(h,a){return toHex(hexToRgb(h).map(function(v){return v*(1-a);}));}

function sizes(){
  if(W<560) return {svc:78,deco:46};
  if(W<900) return {svc:96,deco:54};
  return {svc:Math.min(118,Math.min(W,H)*0.16),deco:64};
}

var FACE_KEYS=['f-tp','f-fr','f-bk','f-rt','f-lf','f-bm'];
function makeCube(cfg,size,isDeco,i){
  var el=document.createElement('div');
  el.className='obj'+(isDeco?' deco':'');
  el.style.width=size+'px'; el.style.height=size+'px';
  var c=cfg.color;
  var shade={'f-tp':lighten(c,.28),'f-fr':c,'f-bk':darken(c,.05),'f-rt':darken(c,.14),'f-lf':darken(c,.24),'f-bm':darken(c,.36)};
  var fs=Math.max(11,Math.round(size*0.125));
  var label=isDeco?('<b>'+cfg.txt+'</b>'):('<div><b>'+cfg.tag+'</b><small>'+cfg.kicker+'</small></div>');
  var html='<div class="cube'+(i%2?' tilt':'')+'" style="--h:'+(size/2)+'px;--dur:'+(16+(i%5)*3.5)+'s;--delay:-'+(i*2.3)+'s">';
  FACE_KEYS.forEach(function(k){
    html+='<div class="f '+k+(isDeco?' deco':'')+'" style="--fs:'+fs+'px;background:linear-gradient(160deg,'+lighten(shade[k],.12)+','+shade[k]+' 55%,'+darken(shade[k],.1)+')">'+((k==='f-fr'||k==='f-bk')?label:'')+'</div>';
  });
  html+='</div>';
  el.innerHTML=html;
  if(!isDeco){
    el.setAttribute('role','button'); el.tabIndex=0;
    el.setAttribute('aria-label',cfg.title+' 자세히 보기');
    el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();openPanel(cfg);} });
  }
  else if(cfg.open){
    el.setAttribute('role','button'); el.tabIndex=0;
    el.setAttribute('aria-label',(cfg.label||'')+' — 화장품 용기 · 패키지 디자인 자세히 보기');
    el.addEventListener('keydown',function(e){
      if(e.key!=='Enter'&&e.key!==' ') return;
      e.preventDefault();
      var t=SERVICES.filter(function(x){return x.id===cfg.open;})[0]; if(t) openPanel(t);
    });
  }
  stage.appendChild(el);
  return el;
}

function buildWorld(){
  Composite.clear(world,false,true);
  items=[]; stage.innerHTML='';
  W=hero.clientWidth; H=hero.clientHeight;
  var S=sizes(), t=100;
  World.add(world,[
    Bodies.rectangle(W/2,-t/2+70,W*2,t,{isStatic:true}),
    Bodies.rectangle(W/2,H+t/2-Math.round(H*0.12)+2,W*2,t,{isStatic:true,friction:.5}),
    Bodies.rectangle(-t/2,H/2,t,H*2,{isStatic:true}),
    Bodies.rectangle(W+t/2,H/2,t,H*2,{isStatic:true})
  ]);
  var avBox=document.getElementById('avatar').getBoundingClientRect();
  var avR=Math.max(Math.min(W,H)*0.09, avBox.width*0.36);
  avBody=Bodies.circle(W/2,H*0.52,avR,{isStatic:true,restitution:.7});
  World.add(world,avBody);

  var all=SERVICES.map(function(s){return {cfg:s,size:S.svc,deco:false};})
        .concat(DECO.map(function(d){return {cfg:d,size:Math.round(S.deco*(d.big||1)),deco:true};}));
  var mobile=W<640;
  var SLOT_S = mobile ? [[0.15,0.26],[0.85,0.26],[0.12,0.47],[0.88,0.47],[0.50,0.835]]
                      : [[0.16,0.29],[0.23,0.63],[0.84,0.29],[0.77,0.63],[0.50,0.825]];
  var SLOT_D = mobile ? [[0.13,0.635],[0.90,0.66],[0.30,0.82],[0.74,0.80]]
                      : [[0.075,0.175],[0.06,0.52],[0.94,0.47],[0.32,0.80],[0.68,0.80]];
  var si=0, di=0;
  all.forEach(function(o,i){
    var slot = o.deco ? SLOT_D[di++] : SLOT_S[si++];
    if(!slot) return;
    var x=W*slot[0], y=H*slot[1];
    x=Math.max(o.size*0.8,Math.min(W-o.size*0.8,x));
    y=Math.max(o.size*0.8+90,Math.min(H-o.size*0.75,y));
    var b=Bodies.rectangle(x,y,o.size*1.04,o.size*1.04,{
      chamfer:{radius:o.size*0.1},restitution:.6,friction:.05,frictionStatic:0,
      frictionAir:.06,density:.0016,slop:.02
    });
    b.home={x:x,y:y};
    var spring=Matter.Constraint.create({pointA:{x:x,y:y},bodyB:b,stiffness:0.0025,damping:0.02,length:0,render:{visible:false}});
    b.spring=spring; World.add(world,spring);
    var el=makeCube(o.cfg,o.size,o.deco,i);
    items.push({body:b,el:el,cfg:o.cfg,deco:o.deco,size:o.size,tag:null});
    World.add(world,b);
  });
  if(typeof OBJ3D!=='undefined' && OBJ3D) OBJ3D.refresh();
}

function sync(){
  for(var i=0;i<items.length;i++){
    var it=items[i], b=it.body, s=it.size;
    it.el.style.transform='translate3d('+(b.position.x-s/2)+'px,'+(b.position.y-s/2)+'px,0) rotate('+b.angle+'rad)';
    if(it.tag) it.tag.style.transform='translateX(-50%) rotate('+(-b.angle)+'rad)';
  }
}

var driftT=0;
function drift(){
  if(engine.gravity.y!==0) return;
  driftT+=0.016;
  for(var i=0;i<items.length;i++){
    var b=items[i].body, h=b.home; if(!h) continue;
    /* the anchor itself bobs a little so the piece hovers instead of sitting dead still */
    b.spring.pointA.x=h.x+Math.sin(driftT*0.6+i*1.7)*10;
    b.spring.pointA.y=h.y+Math.cos(driftT*0.5+i*2.3)*14;
    /* settle the spin back to upright between throws */
    Body.setAngularVelocity(b, b.angularVelocity*0.96 - b.angle*0.002);
  }
}

/* ===== 오브제 3D (GLB) =====
   objects/ 폴더에 GLB 가 들어오면 build.py 가 data URI 로 채워 넣고, 그때만 이 층이 켜집니다.
   GLB 가 없거나 WebGL 이 없거나 로딩이 실패하면 지금 CSS 큐브가 그대로 보입니다. */
var GLB={pkg:'models/obj-package.glb',label:'models/obj-label.glb',detail:'models/obj-detail.glb',web:'models/obj-web.glb',ra:'models/obj-ra.glb',
         d0:'models/deco-bling.glb',d1:'models/deco-cap.glb',d2:'models/deco-box.glb',d3:'models/deco-plane.glb',d4:'models/deco-star.glb'};
function glbSrc(k){ var v=GLB[k]; if(!v || v.indexOf('__')===0) return null;
  return (v.slice(0,5)==='data:') ? (v.length>32 ? v : null) : v; }

var OBJ3D=(function(){
  var any=false; for(var k in GLB){ if(glbSrc(k)){ any=true; break; } }
  if(!any || typeof THREE==='undefined' || typeof THREE.GLTFLoader!=='function') return null;

  var cv=document.createElement('canvas'); cv.id='objgl'; cv.setAttribute('aria-hidden','true');
  var r;
  try{ r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true,premultipliedAlpha:true}); }
  catch(e){ return null; }
  hero.insertBefore(cv,stage);
  r.setClearAlpha(0);
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  if(THREE.sRGBEncoding) r.outputEncoding=THREE.sRGBEncoding;

  var scene=new THREE.Scene();
  /* ---- 얼굴 마스터와 같은 조명 ----
     오브제 이미지는 광택 없이 색의 면만 뽑아 오고, 광택과 방향광은 여기서 겁니다.
     그래야 오브제가 돌아도 반사점이 화면에 고정되어 얼굴과 같은 빛을 받는 것처럼 보입니다. */
  scene.add(new THREE.HemisphereLight(0xffffff,0xcfcabf,0.35));
  var key =new THREE.DirectionalLight(0xFFFAF2,0.85); key.position.set(-1.05,1.25,1.35); scene.add(key);   /* 왼쪽 위 주광 */
  var rim =new THREE.DirectionalLight(0x8FC9FF,0.95); rim.position.set(1.65,0.35,-0.75); scene.add(rim);   /* 오른쪽 뒤 차가운 림라이트 */
  var fill=new THREE.DirectionalLight(0xFFFFFF,0.12); fill.position.set(0.60,-0.70,1.10); scene.add(fill); /* 아래쪽 채움 */

  /* 스튜디오 환경 반사 — 위가 밝고 아래가 어두운 세로 그라데이션 한 장이면 충분합니다.
     맑은 코팅(clearcoat)이 이걸 받아 젖은 느낌을 냅니다. */
  var env=null;
  try{
    var ec=document.createElement('canvas'); ec.width=16; ec.height=128;
    var ex=ec.getContext('2d'), gd=ex.createLinearGradient(0,0,0,128);
    gd.addColorStop(0.00,'#F2F0EA'); gd.addColorStop(0.40,'#DEDBD4');
    gd.addColorStop(0.54,'#B4B0A8'); gd.addColorStop(1.00,'#54514B');
    ex.fillStyle=gd; ex.fillRect(0,0,16,128);
    var et=new THREE.CanvasTexture(ec); et.mapping=THREE.EquirectangularReflectionMapping;
    var pm=new THREE.PMREMGenerator(r);
    env=pm.fromEquirectangular(et).texture;
    scene.environment=env;
    et.dispose(); pm.dispose();
  }catch(e){}

  /* Tripo 가 구워 온 밋밋한 텍스처에 맑은 코팅을 씌워 얼굴과 같은 재질로 만듭니다 */
  function glossify(root){
    root.traverse(function(m){
      if(!m.isMesh) return;
      var src=m.material;
      var mat=new THREE.MeshPhysicalMaterial({
        color: (src&&src.color) ? src.color.clone() : new THREE.Color(0xffffff),
        map:   (src&&src.map)   ? src.map : null,
        roughness:0.40, metalness:0.0,
        clearcoat:1.0, clearcoatRoughness:0.09,
        envMapIntensity:0.45
      });
      if(src&&src.vertexColors) mat.vertexColors=true;
      /* 법선이 없는 GLB 는 조명 계산이 전부 0이 되어 새까맣게 나옵니다 */
      if(m.geometry && !m.geometry.attributes.normal) m.geometry.computeVertexNormals();
      m.material=mat;
      m.frustumCulled=false; m.castShadow=false;
    });
  }

  var cam=new THREE.OrthographicCamera(-1,1,1,-1,-4000,4000); cam.position.z=1200;

  /* 아티팩트 안에서는 blob: 이 막힙니다. GLTFLoader 가 createImageBitmap 을 쓰지 않게 잠시 지우고,
     GLB 안의 텍스처는 빌드 단계에서 data URI 로 바꿔 넣습니다. */
  var loader=new THREE.GLTFLoader();
  function b64buf(u){
    var b=atob(u.slice(u.indexOf(',')+1)), n=b.length, a=new Uint8Array(n);
    for(var i=0;i<n;i++) a[i]=b.charCodeAt(i);
    return a.buffer;
  }
  var models={}, pending=0, cib=window.createImageBitmap;
  try{ window.createImageBitmap=undefined; }catch(e){}
  function restore(){ if(--pending<=0){ try{ window.createImageBitmap=cib; }catch(e){} } }
  Object.keys(GLB).forEach(function(k){
    var src=glbSrc(k); if(!src) return;
    pending++;
    var done=function(g){
      var o=g.scene||(g.scenes&&g.scenes[0]);
      if(o){ glossify(o); models[k]=o; }
      restore(); refresh();
    };
    try{
      /* 아티팩트에 넣을 때는 data URI, 배포본에서는 별도 파일 주소로 들어옵니다 */
      if(src.slice(0,5)==='data:') loader.parse(b64buf(src),'',done,function(){ restore(); });
      else loader.load(src,done,null,function(){ restore(); });
    }catch(e){ restore(); }
  });

  var slots=[];   /* {item, group, spin} */

  /* Tripo 가 앞면 이미지 하나로 뒷면을 지어내면서 두께를 과하게 잡는 경우가 있습니다.
     스마트폰이 옆에서 식빵처럼 보여, 브라우저 창과 같은 두께 비율로 눌러 맞춥니다. */
  var SQUASH = { detail:[1,1,0.52] };
  function shape(obj,key){
    var q=SQUASH[key]; if(!q) return obj;
    var g=new THREE.Group(); g.scale.set(q[0],q[1],q[2]); g.add(obj);
    return g;
  }

  function fit(obj,size){
    var box=new THREE.Box3().setFromObject(obj), c=new THREE.Vector3(), s=new THREE.Vector3();
    box.getCenter(c); box.getSize(s);
    var m=Math.max(s.x,s.y,s.z)||1;
    var inner=new THREE.Group(); inner.add(obj);
    obj.position.sub(c);
    inner.scale.setScalar(size/m*0.92);
    return inner;
  }
  function keyFor(it,i){
    if(!it.deco) return it.cfg.id;
    var n=0; for(var j=0;j<i;j++) if(items[j].deco) n++;
    return 'd'+n;
  }
  function clear(){
    slots.forEach(function(s){ scene.remove(s.group); });
    slots=[];
  }
  function refresh(){
    clear();
    for(var i=0;i<items.length;i++){
      var it=items[i], m=models[keyFor(it,i)];
      it.el.classList.toggle('is3d',!!m);
      if(!m) continue;
      if(!it.el.querySelector('.objlabel') && !it.deco){
        var lb=document.createElement('div'); lb.className='objlabel';
        lb.innerHTML='<b>'+it.cfg.tag.replace(/<br>/g,' ')+'</b><small>'+it.cfg.kicker+'</small>';
        it.el.appendChild(lb);
      }
      else if(!it.el.querySelector('.objlabel') && it.deco && it.cfg.label){
        var lc=document.createElement('div'); lc.className='objlabel credit';
        lc.innerHTML='<small>'+it.cfg.label+'</small>';
        it.el.appendChild(lc);
      }
      var g=fit(shape(m.clone(true), keyFor(it,i)), it.size);
      var wrap=new THREE.Group(); wrap.add(g); scene.add(wrap);
      slots.push({item:it,group:wrap,spin:g,phase:i*0.7});
    }
    resize();
  }
  function resize(){
    var w=hero.clientWidth,h=hero.clientHeight;
    r.setSize(w,h,false);
    cam.left=-w/2; cam.right=w/2; cam.top=h/2; cam.bottom=-h/2; cam.updateProjectionMatrix();
  }
  var t=0;
  function render(dt){
    if(!slots.length) return;
    t+=dt/1000;
    for(var i=0;i<slots.length;i++){
      var s=slots[i], b=s.item.body;
      s.group.position.set(b.position.x-hero.clientWidth/2, hero.clientHeight/2-b.position.y, 0);
      s.group.rotation.z=-b.angle;
      s.spin.rotation.y=t*0.6+s.phase;
      s.spin.rotation.x=Math.sin(t*0.5+s.phase)*0.08;
    }
    r.render(scene,cam);
  }
  window.addEventListener('resize',resize);
  return {refresh:refresh,render:render,resize:resize};
})();

function attachMouse(){
  mouse=Mouse.create(hero);
  mouse.pixelRatio=1;   /* DOM 좌표계는 CSS 픽셀. devicePixelRatio 를 넣으면 레티나에서 엉뚱한 큐브를 잡는다 */
  mc=MouseConstraint.create(engine,{mouse:mouse,constraint:{stiffness:.18,damping:.12,render:{visible:false}}});
  World.add(world,mc);
  mouse.element.removeEventListener('wheel',mouse.mousewheel);
  mouse.element.removeEventListener('DOMMouseScroll',mouse.mousewheel);
  mouse.element.removeEventListener('touchstart',mouse.mousedown);
  mouse.element.removeEventListener('touchmove',mouse.mousemove);
  mouse.element.removeEventListener('touchend',mouse.mouseup);
  function quiet(fn){
    return function(e){
      if(mc&&mc.body){ fn(e); return; }
      var pd=e.preventDefault; e.preventDefault=function(){}; fn(e); e.preventDefault=pd;
    };
  }
  mouse.element.addEventListener('touchstart',quiet(mouse.mousedown),{passive:false});
  mouse.element.addEventListener('touchmove', quiet(mouse.mousemove),{passive:false});
  mouse.element.addEventListener('touchend',  quiet(mouse.mouseup),  {passive:false});

  var downAt=null, downBody=null, downTime=0, faceDown=false, uiDown=false;
  var ptrHist=[];                                   /* 최근 포인터 위치 (플릭 속도 계산용) */
  hero.addEventListener('pointermove',function(e){
    var now=performance.now(); ptrHist.push({x:e.clientX,y:e.clientY,t:now});
    while(ptrHist.length && now-ptrHist[0].t>140) ptrHist.shift();
  });
  function flickSpeed(){                            /* 놓기 직전 140ms 의 손 속도 (px/ms). 멈췄다 놓으면 0 */
    if(ptrHist.length<2) return 0;
    var a=ptrHist[0], b=ptrHist[ptrHist.length-1];
    var dist=Math.hypot(b.x-a.x,b.y-a.y);
    if(dist<60) return 0;                           /* 손이 60px 도 안 움직였으면 던진 게 아니다 */
    return dist/Math.max(1,b.t-a.t);
  }
  Events.on(mc,'startdrag',function(e){
    if(faceDown||uiDown){ mc.constraint.bodyB=null; mc.body=null; return; }   /* 얼굴이나 버튼을 눌렀으면 큐브를 끌지 않는다 */
    downBody=e.body; if(!HEAD.busy()) setFace('nod');
  });
  Events.on(mc,'enddrag',function(e){
    var v=flickSpeed();
    hero.dataset.lastThrow=v.toFixed(2);
    lastReleased=e.body; lastRelease=Date.now();
    if(v>2.0) setFace('tsk');                /* 세게 던졌을 때 — 초당 2000px 넘는 플릭만 */
    else if(!HEAD.busy()) setFace('idle',1400);
  });
  hero.addEventListener('pointerdown',function(e){
    HEAD.touch();
    downAt={x:e.clientX,y:e.clientY}; downTime=Date.now();
    uiDown = !!(e.target.closest && e.target.closest('.hud,.topbar,#panel,#scrim'));
    faceDown = !uiDown && onFace(e.clientX,e.clientY);
    if(uiDown && mc){ mc.constraint.bodyB=null; mc.body=null; }   /* 버튼 위에서는 큐브를 잡지 않는다 */
  });
  hero.addEventListener('pointerup',function(e){
    if(!downAt) return;
    if(uiDown){ downAt=null; downBody=null; faceDown=false; uiDown=false; return; }   /* 버튼은 자기 일만 한다 */
    var dx=e.clientX-downAt.x, dy=e.clientY-downAt.y, body=downBody||mc.body;
    var tap=Math.sqrt(dx*dx+dy*dy)<7 && Date.now()-downTime<420;
    if(tap && faceDown && onFace(e.clientX,e.clientY)){
      tapFace();                              /* 얼굴이 최우선 */
    }
    else if(tap && body){
      for(var i=0;i<items.length;i++){
        if(items[i].body!==body) continue;
        var oc=items[i].deco ? items[i].cfg.open : true;
        if(!oc) break;
        var target=items[i].deco ? SERVICES.filter(function(x){return x.id===oc;})[0] : items[i].cfg;
        if(!target) break;
        items[i].el.classList.add('pop');
        (function(el){ setTimeout(function(){ el.classList.remove('pop'); },300); })(items[i].el);
        openPanel(target); break;
      }
    }
    else if(tap && !body && !e.target.closest('.obj,.avatar,.topbar,.hud,#panel,#scrim')){
      if(!HEAD.busy()) setFace('no',1800);    /* 빈 곳 클릭 */
    }
    downAt=null; downBody=null; faceDown=false; uiDown=false;
  });
}

/* 오브제가 얼굴에 부딪히면 입김 */
var blowAt=0, lastReleased=null, lastRelease=0;
Events.on(engine,'collisionStart',function(ev){
  if(!avBody) return;
  for(var i=0;i<ev.pairs.length;i++){
    var pr=ev.pairs[i], other=null;
    if(pr.bodyA===avBody) other=pr.bodyB; else if(pr.bodyB===avBody) other=pr.bodyA; else continue;
    if(mc && mc.body===other) break;                              /* 손에 잡힌 채로 밀어 넣은 건 안 친다 */
    var thrown = other===lastReleased && Date.now()-lastRelease<1800;  /* 방금 던진 큐브만 — 떨어지거나 떠다니다 스친 건 제외 */
    var v=speedOf(other);
    if(thrown && v>6 && Date.now()-blowAt>6000 && (!HEAD.busy()||HEAD.now()==='nod')){ blowAt=Date.now(); setFace('blow'); }
    break;
  }
});

var gs=document.getElementById('gswitch');
gs.addEventListener('click',function(){
  var on=gs.getAttribute('aria-pressed')==='true';
  gs.setAttribute('aria-pressed',on?'false':'true');
  engine.gravity.y=on?0:1;
  setFace('chill',2200);
  for(var i=0;i<items.length;i++){
    var b=items[i].body;
    b.frictionAir = on?0.06:0.012;
    b.friction    = on?0.05:0.22;
    b.restitution = on?0.6:0.42;
    b.spring.stiffness = on?0.0025:0;   /* gravity on: let go of the anchors */
    if(!on) Body.applyForce(b,b.position,{x:(Math.random()-.5)*0.004*b.mass,y:0.002*b.mass});
  }
});

/* ===== head turning ===== */
var hrx=0, hry=0, htx=0, hty=0, lastPointer=0, headT=0, nextWink=6000;
hero.addEventListener('pointermove',function(e){
  var r=hero.getBoundingClientRect();
  var nx=(e.clientX-r.left)/r.width-0.5, ny=(e.clientY-r.top)/r.height-0.5;
  hty=nx*60; htx=-ny*30; lastPointer=Date.now();
});
hero.addEventListener('pointerleave',function(){ lastPointer=0; });
function headTick(dt){
  headT+=dt/1000;
  if(mc&&mc.body){
    /* watch the cube being dragged */
    var nx=mc.body.position.x/W-0.5, ny=mc.body.position.y/H-0.5;
    hty=nx*62; htx=-ny*34;
  } else if(Date.now()-lastPointer>2200){
    /* nobody pointing: look around on its own */
    hty=Math.sin(headT*0.55)*22+Math.sin(headT*1.9)*4;
    htx=Math.sin(headT*0.83)*8-2;
  }
  hrx+=(htx-hrx)*0.09; hry+=(hty-hry)*0.09;
  HEAD.set(hry*Math.PI/180, -hrx*Math.PI/180, Math.sin(headT*0.7)*0.02); HEAD.tick(dt);
  nextWink-=dt;
  if(nextWink<0){ nextWink=18000+Math.random()*10000; if(faceKey==='idle'&&!HEAD.busy()) setFace('shades',0,true); }
}

var running=false, raf=null, last=0;
function loop(now){
  if(!running) return;
  var dt=Math.min(32,now-last||16.7); last=now;
  drift(); Engine.update(engine,dt); sync(); if(OBJ3D) OBJ3D.render(dt); headTick(dt);
  raf=requestAnimationFrame(loop);
}
function start(){ if(running||reduce) return; running=true; last=0; raf=requestAnimationFrame(loop); }
function stop(){ running=false; if(raf) cancelAnimationFrame(raf); }

var rt=null;
window.addEventListener('resize',function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    stop();
    if(mc){ World.remove(world,mc); mc=null; }
    buildWorld(); sync();
    if(!reduce){ attachMouse(); start(); }
  },220);
});
if('IntersectionObserver' in window){
  new IntersectionObserver(function(en){
    en.forEach(function(e){ if(e.isIntersecting) start(); else stop(); });
  },{threshold:0.02}).observe(hero);
}

buildWorld(); sync();
if(!reduce){ attachMouse(); start(); }
/* 주소 뒤에 #debug 를 붙이면 검증 스크립트가 물리 상태를 만질 수 있다. 평소엔 아무것도 노출하지 않는다 */
/* 진단용 postMessage 훅 — 주소 끝에 #debug 를 붙였을 때만 열린다 */
if(location.hash.indexOf('debug')>=0) window.addEventListener('message',function(e){
  var d=e.data; if(!d||d.dk!=='diag') return;
  try{
    if(d.act==='tap') tapFace();
    else if(d.act==='use'&&d.k) setFace(d.k,1800);
  }catch(err){}
  setTimeout(function(){
    var rep={dk:'diag-reply',hidden:document.hidden,bubble:bubbleEl.textContent,head:HEAD.diag?HEAD.diag():'no-webgl',ua:navigator.userAgent,vis:document.visibilityState};
    try{ e.source.postMessage(rep,'*'); }catch(err){}
  }, d.wait||0);
});
if(location.hash.indexOf('debug')>=0){ window.DK={engine:engine,Body:Body,get items(){return items;},get avBody(){return avBody;},setFace:setFace,head:HEAD}; }

/* ===== loader =====
   진행률은 「몇 번 그렸는가」가 아니라 「실제로 몇 초 지났는가」로 셉니다.
   느린 기기에서 화면이 바쁘면 setInterval 이 밀리는데, 그때 로딩 화면이 하염없이 늘어나던 문제를 막습니다. */
(function(){
  var bar=document.getElementById('lbar'), pct=document.getElementById('lpct'), box=document.getElementById('loader');
  var now=function(){ return (window.performance&&performance.now)?performance.now():Date.now(); };
  var t0=now(), doneAt=0, v=0;
  var SPAN=3200;          /* 준비가 안 끝나도 이 시간 동안 96% 까지 찹니다 */
  var CLOSE=420;          /* 준비가 끝난 뒤 100% 까지 채우는 시간 */
  var tick=setInterval(function(){
    var el=now()-t0, t;
    if(doneAt) t=Math.min(100, v + (100-v) * Math.min(1,(now()-doneAt)/CLOSE) + 1);
    else       t=Math.min(96, el/SPAN*96);
    if(t>v) v=t;
    bar.style.width=v+'%'; pct.textContent=Math.round(v)+'%';
    if(v>=99.5){
      v=100; bar.style.width='100%'; pct.textContent='100%';
      clearInterval(tick); box.classList.add('done');
      setTimeout(function(){ box.style.display='none'; },560);
    }
  },40);
  function ready(){ if(!doneAt) doneAt=now(); }
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(ready);
  window.addEventListener('load',ready);
  setTimeout(ready,SPAN);
})();
})();
</script>
